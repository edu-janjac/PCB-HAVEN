<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB HAVEN</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/store.css">
    <script src="js/fetcher.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <div id="page-container">
        <nav id="topnav"></nav>
        <div class="container">
            <main>
                <section class="store-section">
                    <h1>Our Store</h1>
                    <p>
                        Welcome to our store! Here you can find all the PCBs 
                        and electronic components you need.
                    </p>
                    
                    <div class="list-products">
                        <div class="item">
                            <img src="/images/pcbprodct.png" alt="pcb product">
                            <h2>PRODUCT NAME</h2>
                            <div class="price">$2.99</div>
                            <button class="addCart">
                                Add To Cart
                            </button>
                        </div>
                    </div>
                    <div class="cart-tab">
                        <h1>Shopping Cart</h1>
                        <div class="cart-list">
                            <div class="item">
                                
                            </div>
                        </div>
                        <div class="btn">
                            <button class="close">CLOSE</button>
                            <button class="checkout">CHECK OUT</button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <!--<footer id="footer"></footer>-->
    </div>
</body>
</html>
